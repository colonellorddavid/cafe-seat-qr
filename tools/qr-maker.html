<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR 만들기</title>
<style>
:root{--bg:#F3F5F2;--card:#fff;--fg:#1C2420;--muted:#5D6A63;--line:#D6DDD5;--accent:#1F6B57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A17;--card:#1C2420;--fg:#E7ECE9;--muted:#9BA8A1;--line:#33403A;--accent:#5CC0A0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
label{font-weight:600;font-size:14px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:var(--card);color:var(--fg)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.lang{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:9px}.lang button{background:transparent;color:var(--muted);padding:5px 12px;font-size:13px;border-radius:7px}.lang button.on{background:var(--card);color:var(--fg)}
.err{color:#C0392B;font-weight:600;min-height:1.2em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.card{background:#fff;color:#1C2420;border:1px solid #D6DDD5;border-radius:16px;padding:22px 18px;text-align:center;break-inside:avoid}
.card h2{margin:0;font-size:24px}
.card p{margin:4px 0 12px;color:#5D6A63;font-size:14px}
.card .qr svg{width:100%;max-width:240px;height:auto}
.card .where{font-size:12px;color:#5D6A63;margin-top:8px}
.card .cafe{font-size:13px;color:#1F6B57;font-weight:700}
@media print{body{background:#fff}.form,.sub,h1,.noprint{display:none}.cards{grid-template-columns:1fr 1fr}.card{border:1px solid #999}}
</style>
</head>
<body>
<div class="wrap">
<div class="row noprint" style="justify-content:space-between;align-items:flex-start"><div><h1 data-t="title"></h1><p class="sub" data-t="lead"></p></div><div class="lang"><button id="lk">한국어</button><button id="le">English</button></div></div>
<div class="form">
  <label for="url" data-t="url"></label>
  <input id="url" placeholder="https://script.google.com/macros/s/..../exec" autocomplete="off">
  <label for="cafe" data-t="cafe"></label>
  <input id="cafe">
  <div class="err" id="err"></div>
  <div class="row"><button id="go" data-t="go"></button><button class="ghost" id="print" hidden data-t="print"></button></div>
</div>
<div class="cards" id="cards"></div>
<p class="sub noprint" id="hint" hidden data-t="hint"></p>
</div>
<script src="qrcode.js"></script>
<script>
var T = {
  ko: { title: 'QR 만들기', lead: '배포한 웹 앱 주소(/exec로 끝나는 주소)를 붙여넣으면 입장, 퇴장, 좌석 현황 QR 세 장이 만들어집니다. 인터넷 없이도 동작하고, 주소는 이 컴퓨터 밖으로 보내지 않아요.',
    url: '웹 앱 주소', cafe: '카페 이름 (QR 카드에 표시, 선택)', cafePh: '예: 우리 카페', go: 'QR 만들기', print: '인쇄하기',
    hint: '인쇄하기 → "PDF로 저장"을 고르면 파일로 보관할 수 있어요.', err: '주소가 https://script.google.com/macros/s/…/exec 모양인지 확인해 주세요.',
    kinds: [['입장', 'QR을 찍고 빈자리를 눌러 앉으세요', '테이블 · 입구에 붙이기'], ['퇴장', '나가실 때 찍고 내 자리를 비워주세요', '출구 · 반납대에 붙이기'], ['좌석 현황', '빈자리와 혼잡도를 실시간으로 확인하세요', '홈페이지 · SNS · 매장 밖 안내판']] },
  en: { title: 'QR maker', lead: 'Paste your web app URL (the one ending in /exec) to get three QR codes: check in, check out and live seat map. Works offline; the URL never leaves this computer.',
    url: 'Web app URL', cafe: 'Cafe name (shown on the QR cards, optional)', cafePh: 'e.g. Our Cafe', go: 'Make QR codes', print: 'Print',
    hint: 'Print → "Save as PDF" keeps them as a file.', err: 'Check that the URL looks like https://script.google.com/macros/s/…/exec',
    kinds: [['Check in · 입장', 'Scan, then tap a free seat to sit', 'Tables · entrance'], ['Check out · 퇴장', 'Scan when you leave to free your seat', 'Exit · tray return'], ['Live seats · 좌석 현황', 'See free seats and how busy we are', 'Website · social media · sign outside']] }
};
var QS = ['?p=in', '?p=out', ''];
var lang = /[?&]lang=en/.test(location.search) ? 'en' : 'ko';
function applyLang(){
  var L = T[lang]; document.documentElement.lang = lang; document.title = L.title;
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = L[el.getAttribute('data-t')]; });
  document.getElementById('cafe').placeholder = L.cafePh;
  document.getElementById('lk').className = lang === 'ko' ? 'on' : ''; document.getElementById('le').className = lang === 'en' ? 'on' : '';
  if (document.getElementById('cards').innerHTML) make();
}
function qrSvg(text){ var qr = qrcode(0, 'M'); qr.addData(text); qr.make(); return qr.createSvgTag({ cellSize: 6, margin: 4, scalable: true }); }
function esc(s){ return s.replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function make(){
  var raw = document.getElementById('url').value.trim(), err = document.getElementById('err'), L = T[lang];
  var base = raw.split('?')[0].split('#')[0];
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(base)) { err.textContent = L.err; return; }
  err.textContent = '';
  var cafe = esc(document.getElementById('cafe').value.trim());
  document.getElementById('cards').innerHTML = L.kinds.map(function(k, i){
    return '<div class="card">' + (cafe ? '<div class="cafe">' + cafe + '</div>' : '') + '<h2>' + k[0] + '</h2><p>' + k[1] + '</p><div class="qr">' + qrSvg(base + QS[i]) + '</div><div class="where">' + k[2] + '</div></div>';
  }).join('');
  document.getElementById('print').hidden = false;
  document.getElementById('hint').hidden = false;
}
document.getElementById('go').onclick = make;
document.getElementById('lk').onclick = function(){ lang = 'ko'; applyLang(); };
document.getElementById('le').onclick = function(){ lang = 'en'; applyLang(); };
document.getElementById('print').onclick = function(){ window.print(); };
applyLang();
</script>
</body>
</html>
